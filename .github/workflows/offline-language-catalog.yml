name: Verify offline language catalog
on:
  push:
    paths:
      - scripts/verify_translation_catalog.py
      - .github/workflows/offline-language-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-model-data:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official data packages and pin content hashes
        run: python scripts/verify_translation_catalog.py --output work/offline-language-catalog.json --workers 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-offline-language-catalog
          path: work/offline-language-catalog.json
