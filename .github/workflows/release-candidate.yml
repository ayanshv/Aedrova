name: Release candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Desktop checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libpulse0
      - name: Locked dependencies
        run: |
          python -m pip install uv==0.12.6
          uv sync --locked
      - name: Source and secret checks
        run: |
          uv run ruff check src scripts tests
          uv run python scripts/check_release_secrets.py --tracked
          uv run python -m compileall -q src scripts
      - name: Account, chat, AI, connectors and desktop regressions
        run: uv run pytest -q --junitxml=work/desktop-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-tests-${{ matrix.os }}
          path: work/desktop-tests.xml
  database:
    name: PostgreSQL RLS checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install uv==0.12.6
          uv sync --locked
          uv run python scripts/test_database.py
